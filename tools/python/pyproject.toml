[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bbrsim"
version = "0.1.0"
description = "BBRsim analysis package: ROOT loader, physics reference formulas, selections, HFSS mirror"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "uproot", "scipy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bbrsim*"]
